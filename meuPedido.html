<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acompanhe seu Pedido - HollyBrazil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            70% { transform: scale(1.25); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }
        .pulse-active {
            position: relative;
        }
        .pulse-active::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: #facc15;
            z-index: -1;
            animation: pulse-ring 1.8s infinite;
        }

        footer {
            background-color: #ffffff;
            color: #333333;
            padding: 30px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 16px;
        }

        .footer-info span {
            margin: 0 15px;
            display: inline-block;
            color: #555555;
        }

        .footer-info strong {
            color: #000000;
        }

        .copyright {
            margin-top: 16px;
            font-size: 12px;
            color: #888888;
        }

        @media (max-width: 600px) {
            .footer-info span {
                display: block;
                margin: 8px 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-900">

    <!-- HEADER -->
    <header class="bg-white/90 backdrop-blur-lg sticky top-0 z-40 border-b border-gray-100">
        <div class="container mx-auto max-w-2xl px-4">
            <div class="h-16 flex justify-between items-center gap-3">
                <div class="min-w-0">
                    <h1 id="nome-loja" class="font-black italic text-lg tracking-tighter uppercase text-gray-800 truncate">
                        CARREGANDO...
                    </h1>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">
                        Acompanhamento em tempo real
                    </p>
                </div>

                <div class="flex items-center gap-2 shrink-0 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
                    <span id="indicador-sync" class="w-2 h-2 rounded-full bg-green-500"></span>
                    <span id="texto-contador" class="text-[10px] font-black uppercase text-gray-700">
                        Atualiza em 60s
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container mx-auto max-w-2xl px-4 py-6 flex-1">

        <!-- SKELETON INICIAL -->
        <div id="loading-skeleton" class="bg-white p-6 rounded-[2rem] border border-gray-100 animate-pulse space-y-5">
            <div class="h-6 bg-gray-200 w-1/3 rounded"></div>
            <div class="h-10 bg-gray-200 w-2/3 rounded-xl"></div>
            <div class="space-y-3 pt-2">
                <div class="h-12 bg-gray-200 rounded-2xl"></div>
                <div class="h-12 bg-gray-200 rounded-2xl"></div>
                <div class="h-12 bg-gray-200 rounded-2xl"></div>
            </div>
        </div>

        <!-- CONTEÚDO DO PEDIDO -->
        <div id="pedido-conteudo" class="hidden space-y-5"></div>

        <!-- ESTADO DE ERRO / NÃO ENCONTRADO -->
        <div id="estado-erro" class="hidden bg-white p-10 rounded-[2rem] border border-gray-100 text-center space-y-3">
            <p class="font-black italic uppercase text-gray-900 text-lg">Pedido não encontrado</p>
            <p id="mensagem-erro" class="text-xs font-bold text-gray-500">
                Não foi possível localizar os dados deste pedido.
            </p>
            <button onclick="atualizarAgora()" class="mt-2 bg-yellow-400 text-black px-6 py-3 rounded-2xl font-black text-xs uppercase shadow-md active:scale-95 transition-all">
                Tentar Novamente
            </button>
        </div>

    </main>

    <!-- RODAPÉ -->
    <div id="footer-wrapper"></div>

    <script>
        const WEBHOOK_CONSULTA = "https://n8n.hollybrasil.com.br/webhook/5d8dcdcd-97dd-4bec-a6a2-ecba9f29dbc4";
        const INTERVALO_SEGUNDOS = 60;

        const params = new URLSearchParams(window.location.search);
        const idLoja = params.get('l') || '';
        const carrinhoParam = (params.get('c') || params.get('pedido') || '').trim().toUpperCase();

        let segundosRestantes = INTERVALO_SEGUNDOS;
        let timerInterval = null;
        let carregando = false;

        const ETAPAS = [
            {
                key: 'solicitada',
                titulo: 'Pedido Recebido',
                descricao: 'Aguardando confirmação do estabelecimento.'
            },
            {
                key: 'em_producao',
                titulo: 'Pedido Confirmado',
                descricao: 'O restaurante aceitou seu pedido.'
            },
            {
                key: 'em_producao',
                titulo: 'Em Preparo',
                descricao: 'Seu pedido está sendo preparado agora.'
            },
            {
                key: 'saiu_entrega',
                titulo: 'Saiu para Entrega',
                descricao: 'O entregador já está a caminho do seu endereço.'
            },
            {
                key: 'entregue',
                titulo: 'Pedido Entregue',
                descricao: 'Pedido finalizado com sucesso. Bom apetite!'
            }
        ];

        function limparValor(val) {
            if (typeof val === 'string') {
                const matchInt = val.match(/^NumberInt\(['"]?(.*?)['"]?\)$/);
                if (matchInt) return Number(matchInt[1]);
                const matchObjId = val.match(/^ObjectId\(['"]?(.*?)['"]?\)$/);
                if (matchObjId) return matchObjId[1];
            }
            return val;
        }

        function normalizarPedido(raw) {
            if (!raw || typeof raw !== 'object') return null;

            const loja = raw.loja ? {
                ...raw.loja,
                lojaId: limparValor(raw.loja.lojaId),
                valorTele: limparValor(raw.loja.valorTele),
                endereco: raw.loja.endereco ? {
                    ...raw.loja.endereco,
                    numero: limparValor(raw.loja.endereco.numero)
                } : null
            } : null;

            const itens = Array.isArray(raw.itens) ? raw.itens.map(item => ({
                ...item,
                valorFinal: Number(limparValor(item.valorFinal) || 0),
                adicionais: Array.isArray(item.adicionais) ? item.adicionais.map(add => ({
                    ...add,
                    preco: Number(limparValor(add.preco) || 0)
                })) : []
            })) : [];

            return {
                ...raw,
                _id: limparValor(raw._id),
                loja,
                itens,
                totalPedido: Number(limparValor(raw.totalPedido) || 0),
                totalTele: raw.totalTele === null || raw.totalTele === undefined ? null : Number(limparValor(raw.totalTele)),
                status: String(raw.status || 'solicitada').toLowerCase().trim(),
                carrinhoId: String(raw.carrinhoId || raw.pedidoId || raw._id || ''),
                dataCriacao: raw.dataCriacao || raw.createdAt || null,
                cupom: raw.cupom || '',
                formaPagamento: raw.formaPagamento || ''
            };
        }

        function formatarMoeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatarData(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            if (Number.isNaN(d.getTime())) return isoStr;
            return d.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function obterIndiceEtapa(status) {
            if (status === 'solicitado' || status === 'pendente') return 0;
            if (status === 'em_preparo') return 2;
            const idx = ETAPAS.findIndex(e => e.key === status);
            return idx >= 0 ? idx : 0;
        }

        function obterTituloStatus(status) {
            if (status === 'cancelado') return 'PEDIDO CANCELADO';
            const idx = obterIndiceEtapa(status);
            return ETAPAS[idx].titulo.toUpperCase();
        }

        async function consultarPedido() {
            if (carregando) return;

            const skeleton = document.getElementById('loading-skeleton');
            const conteudo = document.getElementById('pedido-conteudo');
            const erro = document.getElementById('estado-erro');
            const msgErro = document.getElementById('mensagem-erro');
            const indicador = document.getElementById('indicador-sync');

            if (!idLoja) {
                skeleton.classList.add('hidden');
                erro.classList.remove('hidden');
                msgErro.textContent = 'Link inválido: parâmetro da loja (?l=) não encontrado.';
                document.getElementById('nome-loja').textContent = 'HOLLYBRAZIL';
                renderFooter(null);
                return;
            }

            carregando = true;
            indicador.className = 'w-2 h-2 rounded-full bg-yellow-400 animate-ping';

            try {
                const url = new URL(WEBHOOK_CONSULTA);
                url.searchParams.set('l', idLoja);

                const res = await fetch(url.toString(), { method: 'GET' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();

                // Aceita retorno único { ... } ou lista [ { ... } ]
                let pedidoBruto = null;
                if (Array.isArray(data)) {
                    if (carrinhoParam) {
                        pedidoBruto = data.find(p => String(p.carrinhoId || '').toUpperCase() === carrinhoParam) || data[0];
                    } else {
                        pedidoBruto = data[0];
                    }
                } else if (data && typeof data === 'object') {
                    pedidoBruto = data;
                }

                const pedido = normalizarPedido(pedidoBruto);

                if (!pedido) {
                    skeleton.classList.add('hidden');
                    conteudo.classList.add('hidden');
                    erro.classList.remove('hidden');
                    msgErro.textContent = 'Nenhum pedido ativo encontrado no momento.';
                    return;
                }

                // Atualiza nome da loja e rodapé
                const nomeLoja = pedido.loja?.nomeEmpresa || pedido.loja?.nome || 'ACOMPANHAMENTO';
                document.getElementById('nome-loja').textContent = nomeLoja;
                renderFooter(pedido.loja);

                // Renderiza a tela do pedido
                skeleton.classList.add('hidden');
                erro.classList.add('hidden');
                conteudo.classList.remove('hidden');
                conteudo.innerHTML = renderPedidoCliente(pedido);

                // Se já foi entregue ou cancelado, para o loop automático
                if (pedido.status === 'entregue' || pedido.status === 'cancelado') {
                    pararContador();
                    document.getElementById('texto-contador').textContent =
                        pedido.status === 'entregue' ? 'Pedido concluído' : 'Pedido encerrado';
                    indicador.className = pedido.status === 'entregue'
                        ? 'w-2 h-2 rounded-full bg-green-500'
                        : 'w-2 h-2 rounded-full bg-red-500';
                } else {
                    indicador.className = 'w-2 h-2 rounded-full bg-green-500';
                }
            } catch (e) {
                console.error('Erro na consulta do pedido:', e);
                indicador.className = 'w-2 h-2 rounded-full bg-red-500';
                // Só exibe tela de erro se ainda não houver um pedido carregado na tela
                if (conteudo.classList.contains('hidden')) {
                    skeleton.classList.add('hidden');
                    erro.classList.remove('hidden');
                    msgErro.textContent = 'Falha de conexão ao buscar seu pedido. Tentando novamente...';
                }
            } finally {
                carregando = false;
            }
        }

        function renderPedidoCliente(pedido) {
            const cancelado = pedido.status === 'cancelado';
            const entregue = pedido.status === 'entregue';
            const etapaAtual = obterIndiceEtapa(pedido.status);
            const horaSync = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const timelineHTML = cancelado
                ? `<div class="bg-red-50 border border-red-200 p-4 rounded-2xl text-red-700 font-bold text-xs">
                        Este pedido foi cancelado. Entre em contato com o estabelecimento caso precise de ajuda.
                   </div>`
                : `<div class="space-y-4">
                        ${ETAPAS.map((etapa, idx) => {
                            const concluida = idx < etapaAtual || entregue;
                            const atual = idx === etapaAtual && !entregue;
                            const pendente = idx > etapaAtual && !entregue;

                            let bolinhaClass = 'bg-gray-200 text-gray-400';
                            if (concluida) bolinhaClass = 'bg-green-500 text-white';
                            if (atual) bolinhaClass = 'bg-yellow-400 text-black pulse-active';

                            return `
                                <div class="flex items-start gap-4 ${pendente ? 'opacity-40' : ''}">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-black text-xs shrink-0 mt-0.5 ${bolinhaClass}">
                                        ${concluida ? '✓' : idx + 1}
                                    </div>
                                    <div class="flex-1 pb-3 ${idx < ETAPAS.length - 1 ? 'border-b border-gray-100' : ''}">
                                        <div class="flex items-center justify-between gap-2">
                                            <p class="font-black uppercase text-sm text-gray-900">${etapa.titulo}</p>
                                            ${atual ? '<span class="text-[10px] font-black uppercase bg-yellow-100 text-yellow-900 px-2.5 py-0.5 rounded-full">Agora</span>' : ''}
                                        </div>
                                        <p class="text-xs font-bold text-gray-500 mt-0.5">${etapa.descricao}</p>
                                    </div>
                                </div>`;
                        }).join('')}
                   </div>`;

            const itensHTML = pedido.itens.map(item => {
                const adds = item.adicionais?.length
                    ? `<div class="mt-2 space-y-1">
                            ${item.adicionais.map(a => `
                                <p class="text-[11px] font-bold text-gray-500">
                                    + ${a.nome} (${formatarMoeda(a.preco)})
                                </p>`).join('')}
                       </div>`
                    : '';

                const obs = item.obs
                    ? `<p class="text-[11px] font-black italic uppercase text-red-600 mt-2">Obs: "${item.obs}"</p>`
                    : '';

                return `
                    <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <div class="flex justify-between items-start gap-3">
                            <p class="font-black text-sm uppercase text-gray-900">${item.nome}</p>
                            <p class="font-black text-sm text-gray-900 shrink-0">${formatarMoeda(item.valorFinal)}</p>
                        </div>
                        ${adds}
                        ${obs}
                    </div>`;
            }).join('');

            const isRetirada = String(pedido.cliente?.endereco || '').toUpperCase() === 'RETIRADA';

            return `
                <!-- CARD PRINCIPAL DE STATUS -->
                <section class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-6">
                    <div class="flex flex-wrap justify-between items-start gap-3 border-b border-gray-100 pb-4">
                        <div>
                            <span class="text-[10px] font-black uppercase tracking-wider text-gray-400">
                                Pedido #${pedido.carrinhoId}
                            </span>
                            <h2 class="font-black italic text-2xl uppercase text-gray-900 mt-0.5">
                                ${obterTituloStatus(pedido.status)}
                            </h2>
                            <p class="text-[11px] font-bold text-gray-400 mt-1">
                                Realizado em ${formatarData(pedido.dataCriacao)} • Última checagem às ${horaSync}
                            </p>
                        </div>

                        <button onclick="atualizarAgora()" class="bg-gray-100 hover:bg-yellow-400 text-gray-900 px-4 py-2 rounded-full font-black text-[10px] uppercase transition-all active:scale-95">
                            Atualizar agora
                        </button>
                    </div>

                    <!-- LINHA DO TEMPO -->
                    ${timelineHTML}
                </section>

                <!-- CARD RESUMO DO PEDIDO -->
                <section class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-4">
                    <h3 class="font-black text-base uppercase italic border-l-4 border-yellow-400 pl-3">
                        Resumo do Pedido
                    </h3>

                    <div class="space-y-3">
                        ${itensHTML}
                    </div>

                    <div class="pt-4 border-t border-gray-100 space-y-1.5 text-xs font-bold uppercase">
                        ${pedido.totalTele !== null ? `
                            <div class="flex justify-between text-gray-500">
                                <span>Taxa de Entrega</span>
                                <span>${formatarMoeda(pedido.totalTele)}</span>
                            </div>` : ''}
                        ${pedido.cupom ? `
                            <div class="flex justify-between text-green-600">
                                <span>Cupom Aplicado</span>
                                <span>${pedido.cupom}</span>
                            </div>` : ''}
                        <div class="flex justify-between text-gray-500">
                            <span>Pagamento</span>
                            <span>${pedido.formaPagamento || 'Não informado'}</span>
                        </div>
                        <div class="flex justify-between text-xl font-black italic text-gray-900 pt-2 border-t border-gray-100">
                            <span>Total</span>
                            <span>${formatarMoeda(pedido.totalPedido)}</span>
                        </div>
                    </div>
                </section>

                <!-- CARD DADOS DE ENTREGA -->
                <section class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 space-y-2">
                    <h3 class="font-black text-base uppercase italic border-l-4 border-yellow-400 pl-3 mb-3">
                        ${isRetirada ? 'Retirada no Local' : 'Endereço de Entrega'}
                    </h3>
                    <p class="font-bold text-sm text-gray-900">${pedido.cliente?.nome || ''}</p>
                    <p class="text-xs font-bold text-gray-500">WhatsApp: ${pedido.cliente?.telefone || ''}</p>
                    <p class="text-xs font-bold text-gray-700">
                        ${isRetirada ? 'Cliente irá retirar no balcão.' : (pedido.cliente?.endereco || '')}
                    </p>
                </section>
            `;
        }

        function renderFooter(loja) {
            const wrapper = document.getElementById('footer-wrapper');
            const rua = loja?.endereco?.rua || '';
            const numero = loja?.endereco?.numero || '';
            const enderecoTexto = (rua || numero) ? `${rua}${rua && numero ? ', ' : ''}${numero}` : 'Não informado';

            wrapper.innerHTML = `
                <footer>
                    <div class="footer-content">
                        <div class="footer-info">
                            <span><strong>Endereço:</strong> ${enderecoTexto}</span>
                            <span><strong>Telefone:</strong> ${loja?.telefone || 'Não informado'}</span>
                            <span><strong>CNPJ:</strong> ${loja?.cnpj || 'Não informado'}</span>
                        </div>
                        <div class="copyright">
                            &copy; 2026 HollyBrazil. Todos os direitos reservados.
                        </div>
                    </div>
                </footer>`;
        }

        function iniciarContador() {
            pararContador();
            segundosRestantes = INTERVALO_SEGUNDOS;

            timerInterval = setInterval(() => {
                segundosRestantes--;
                const el = document.getElementById('texto-contador');
                if (el) {
                    el.textContent = segundosRestantes > 0
                        ? `Atualiza em ${segundosRestantes}s`
                        : 'Atualizando...';
                }

                if (segundosRestantes <= 0) {
                    segundosRestantes = INTERVALO_SEGUNDOS;
                    consultarPedido();
                }
            }, 1000);
        }

        function pararContador() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function atualizarAgora() {
            segundosRestantes = INTERVALO_SEGUNDOS;
            const el = document.getElementById('texto-contador');
            if (el) el.textContent = 'Atualizando...';
            consultarPedido();
        }

        // Start
        consultarPedido();
        iniciarContador();
    </script>
</body>
</html>
